server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/chemtrack?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
    username: root
    # 必须通过环境变量提供，不把数据库密码写进源码，也不使用弱默认密码。
    password: ${CHEMTRACK_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
